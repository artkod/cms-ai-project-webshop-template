  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

px;top:12px\">Skip to content<\u002Fa>\n\n  <dc-import name=\"Header\" locale=\"{{ locale }}\" customer-state=\"{{ customerState }}\" cart-count=\"{{ cartCount }}\" current-screen=\"{{ screen }}\" navigate=\"{{ navigate }}\" on-locale-change=\"{{ setLocale }}\" hint-size=\"100%,64px\"><\u002Fdc-import>\n\n  <main id=\"main\">\n\n  <!-- ============ HOME ============ -->\n  <sc-if value=\"{{ isHome }}\" hint-placeholder-val=\"{{ true }}\">\n    <section data-screen-label=\"Home\" style=\"max-width:1280px;margin:0 auto;padding:0 28px\">\n      <div style=\"display:grid;grid-template-columns:1.1fr 1fr;gap:48px;align-items:center;padding:64px 0 56px\">\n        <div>\n          <div style=\"font-family:'Work Sans',sans-serif;font-size:12px;letter-spacing:0.12em;text-transform:uppercase;color:#A9895E;margin-bottom:16px\">Autumn 2026<\u002Fdiv>\n          <h1 style=\"font-family:'Instrument Serif',serif;font-size:56px;line-height:1.05;margin:0 0 20px;font-style:italic;font-weight:400\">Clothes built to be worn, not replaced.<\u002Fh1>\n          <p style=\"font-size:16px;line-height:1.6;color:#55503F;max-width:44ch;margin:0 0 28px\">Considered essentials, made-to-measure tailoring, and small-batch runs — cut for people who keep their clothes a long time.<\u002Fp>\n          <div style=\"display:flex;gap:12px\">\n            <button onclick=\"{{ goCatalog }}\" style=\"background:#17140F;color:#F5F3EE;border:none;padding:14px 26px;font-family:'Work Sans',sans-serif;font-size:14px;cursor:pointer;border-radius:2px\" style-hover=\"background:#332C1F\">Shop the collection<\u002Fbutton>\n            <button onclick=\"{{ goCms }}\" style=\"background:transparent;color:#17140F;border:1px solid #17140F;padding:14px 26px;font-family:'Work Sans',sans-serif;font-size:14px;cursor:pointer;border-radius:2px\" style-hover=\"background:#EFEAE1\">Our story<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"aspect-ratio:4/5;background:repeating-linear-gradient(13 10px\">This is a made-to-order item — pricing depends on fabric and fit.<\u002Fdiv>\n              <label style=\"display:block;font-size:12px;color:#55503F;margin-bottom:6px\">Email<\u002Flabel>\n              <input placeholder=\"you@email.com\" style=\"width:100%;padding:10px;border:1px solid #D9D2C4;border-radius:2px;margin-bottom:10px;font-family:'Work Sans',sans-serif;font-size:13px\">\n              <label style=\"display:block;font-size:12px;color:#55503F;margin-bottom:6px\">Notes (fit, fabric, timeline)<\u002Flabel>\n              <textarea rows=\"3\" style=\"width:100%;padding:10px;border:1px solid #D9D2C4;border-radius:2px;margin-bottom:14px;font-family:'Work Sans',sans-serif;font-size:13px;resize:vertical\"><\u002Ftextarea>\n              <button style=\"width:100%;background:#17140F;color:#F5F3EE;border:none;padding:13px;font-size:14px;border-radius:2px;cursor:pointer\">Request a quote<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ !isInquiryProduct }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"display:flex;align-items:baseline;gap:10px;margin-bottom:4px\">\n              <span style=\"font-size:22px;font-weight:500\">{{ pPriceLabel }}<\u002Fspan>\n              <sc-if value=\"{{ pHasCompareAt }}\" hint-placeholder-val=\"{{ false }}\">\n                <span style=\"font-size:15px;color:#8A8267;text-decoration:line-through\">{{ pCompareAtLabel }}<\u002Fspan>\n                <span style=\"background:#B5432E;color:#fff;font-size:11px;padding:3px 8px;border-radius:2px\">Sale<\u002Fspan>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ pIsB2B }}\" hint-placeholder-val=\"{{ false }}\">\n                <span style=\"background:#4B6C4F;color:#fff;font-size:11px;padding:3px 8px;border-radius:2px\">Wholesale price<\u002Fspan>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n            <sc-if value=\"{{ pHasCompareAt }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"font-size:11px;color:#8A8267;margin-bottom:20px\">Lowest price in the last 30 days: {{ pLowest30Label }} · required by EU Omnibus Directive<\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ !pHasCompareAt }}\" hint-placeholder-val=\"{{ true }}\">\n              <div style=\"margin-bottom:20px\"><\u002Fdiv>\n            <\u002Fsc-if>\n\n            <p style=\"font-size:14px;line-height:1.7;color:#55503F;margin:0 0 22px\">{{ pDesc }}<\u002Fp>\n\n            <sc-for list=\"{{ optionGroups }}\" as=\"grp\" hint-placeholder-count=\"2\">\n              <div style=\"margin-bottom:20px\">\n                <div role=\"group\" aria-label=\"{{ grp.name }}\">\n                  <div style=\"font-size:12px;font-weight:500;margin-bottom:8px\">{{ grp.name }}: <span style=\"color:#8A8267;font-weight:400\">{{ grp.selected }}<\u002Fspan><\u002Fdiv>\n                  <div style=\"display:flex;flex-wrap:wrap;gap:8px\">\n                    <sc-for list=\"{{ grp.values }}\" as=\"v\" hint-placeholder-count=\"4\">\n                      <button aria-pressed=\"{{ v.pressed }}\" onclick=\"{{ v.onClick }}\" style=\"border:1px solid {{ v.border }};background:{{ v.bg }};color:{{ v.fg }};font-size:13px;padding:9px 14px;border-radius:2px;cursor:pointer;min-width:44px\">{{ v.label }}<\u002Fbutton>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n\n            <sc-if value=\"{{ pInStock }}\" hint-placeholder-val=\"{{ true }}\">\n              <div style=\"font-size:12px;color:#4B6C4F;margin-bottom:16px\">● In stock — SKU {{ pSku }}<\u002Fdiv>\n              <div style=\"display:flex;gap:12px;margin-bottom:16px\">\n                <div style=\"display:flex;align-items:center;border:1px solid #D9D2C4;border-radius:2px\">\n                  <button onclick=\"{{ decQty }}\" aria-label=\"Decrease quantity\" style=\"width:36px;height:44px;border:none;background:none;cursor:pointer;font-size:16px\">−<\u002Fbutton>\n                  <span style=\"width:32px;text-align:center;font-size:14px\">{{ qty }}<\u002Fspan>\n                  <button onclick=\"{{ incQty }}\" aria-label=\"Increase quantity\" style=\"width:36px;height:44px;border:none;background:none;cursor:pointer;font-size:16px\">+<\u002Fbutton>\n                <\u002Fdiv>\n                <button onclick=\"{{ addToCart }}\" style=\"flex:1;background:#17140F;color:#F5F3EE;border:none;padding:0 20px;font-size:14px;border-radius:2px;cursor:pointer\">Add to cart — {{ pPriceLabel }}<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <sc-if value=\"{{ !pInStock }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"font-size:12px;color:#A63B2E;margin-bottom:16px\">● Out of stock<\u002Fdiv>\n              <div style=\"background:#EFEAE1;border-radius:4px;padding:18px;margin-bottom:16px\">\n                <div style=\"font-size:13px;font-weight:500;margin-bottom:10px\">Get notified when it's back<\u002Fdiv>\n                <div style=\"display:flex;gap:8px\">\n                  <input placeholder=\"you@email.com\" style=\"flex:1;padding:10px;border:1px solid #D9D2C4;border-radius:2px;font-family:'Work Sans',sans-serif;font-size:13px\">\n                  <button style=\"background:#17140F;color:#F5F3EE;border:none;padding:0 18px;border-radius:2px;cursor:pointer;font-size:13px\">Notify me<\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <button onclick=\"{{ toggleStockDemo }}\" style=\"background:none;border:none;color:#8A8267;font-size:11px;text-decoration:underline;cursor:pointer;margin-bottom:16px;display:block\">demo: toggle in-stock / out-of-stock<\u002Fbutton>\n\n            <button aria-label=\"Add to wishlist\" style=\"display:flex;align-items:center;gap:8px;background:none;border:1px solid #D9D2C4;padding:10px 16px;border-radius:2px;cursor:pointer;font-size:13px\">\n              <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#17140F\" stroke-width=\"2\"><path d=\"M12 21s-7.5-4.7-10-9.3C.5 8 2 4 6 4c2.2 0 3.8 1.2 6 3.5C14.2 5.2 15.8 4 18 4c4 0 5.5 4 4 7.7C19.5 16.3 12 21 12 21z\"><\u002Fpath><\u002Fsvg>\n              Add to wishlist\n            <\u002Fbutton>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"max-width:720px;margin:0 auto 56px;padding-top:40px;border-top:1px solid #E4DCC9\">\n        <h2 style=\"font-family:'Instrument Serif',serif;font-style:italic;font-weight:400;font-size:22px;margin:0 0 14px\">Details &amp; care<\u002Fh2>\n        <p style=\"font-size:14px;line-height:1.75;color:#55503F;margin:0 0 14px\">{{ pDesc }} Garment-washed for softness; expect a small amount of natural shrinkage on first wash. Machine wash cold, hang to dry.<\u002Fp>\n        <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:20px\">\n          <div style=\"aspect-ratio:16/10;background:repeating-linear-gradient(135deg,#EFEAE1,#EFEAE1 10px,#E4DCC9 10px,#E4DCC9 20px);border-radius:2px;display:flex;align-items:center;justify-content:center;font-family:monospace;font-size:11px;color:#8A8267\">detail shot<\u002Fdiv>\n          <div style=\"aspect-ratio:16/10;background:repeating-linear-gradient(135deg,#EFEAE1,#EFEAE1 10px,#E4DCC9 10px,#E4DCC9 20px);border-radius:2px;display:flex;align-items:center;justify-content:center;font-family:monospace;font-size:11px;color:#8A8267\">fabric close-up<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"max-width:720px;margin:0 auto;padding-top:40px;border-top:1px solid #E4DCC9\">\n        <div style=\"display:flex;align-items:center;gap:14px;margin-bottom:20px\">\n          <h2 style=\"font-family:'Instrument Serif',serif;font-style:italic;font-weight:400;font-size:22px;margin:0\">Reviews<\u002Fh2>\n          <span style=\"font-size:13px;color:#55503F\">★★★★☆ 4.3 ({{ reviewCount }})<\u002Fspan>\n        <\u002Fdiv>\n        <sc-for list=\"{{ reviews }}\" as=\"rv\" hint-placeholder-count=\"2\">\n          <div style=\"border-bottom:1px solid #E4DCC9;padding:16px 0\">\n            <div style=\"display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px\">\n              <strong>{{ rv.name }}<\u002Fstrong>\n              <span style=\"color:#8A8267\">{{ rv.stars }} · {{ rv.date }}<\u002Fspan>\n            <\u002Fdiv>\n            <sc-if value=\"{{ rv.verified }}\" hint-placeholder-val=\"{{ true }}\">\n              <span style=\"font-size:11px;color:#4B6C4F;background:#EAF0EA;padding:2px 8px;border-radius:2px;display:inline-block;margin-bottom:6px\">Verified purchase<\u002Fspan>\n            <\u002Fsc-if>\n            <p style=\"font-size:13px;line-height:1.6;color:#55503F;margin:0\">{{ rv.text }}<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n        <div style=\"background:#EFEAE1;border-radius:4px;padding:18px;margin-top:20px\">\n          <div style=\"font-size:13px;color:#55503F\">Sign in to a verified account to write a review.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n  <\u002Fsc-if>\n\n  <!-- ============ CART ============ -->\n  <sc-if value=\"{{ isCart }}\" hint-placeholder-val=\"{{ false }}\">\n    <section data-screen-label=\"Cart\" style=\"max-width:960px;margin:0 auto;padding:40px 28px 64px\">\n      <h1 style=\"font-family:'Instrument Serif',serif;font-style:italic;font-weight:400;font-size:32px;margin:0 0 28px\">Your cart<\u002Fh1>\n\n      <sc-if value=\"{{ cartIsEmpty }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"text-align:center;padding:64px 24px;border:1px dashed #D9D2C4;border-radius:4px\">\n          <div style=\"font-size:16px;margin-bottom:8px\">Your cart is empty<\u002Fdiv>\n          <button onclick=\"{{ goCatalog }}\" style=\"background:#17140F;color:#F5F3EE;border:none;padding:12px 22px;font-size:13px;border-radius:2px;cursor:pointer;margin-top:8px\">Continue shopping<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ !cartIsEmpty }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"display:grid;grid-template-columns:1fr 320px;gap:48px\">\n          <div>\n            <sc-for list=\"{{ cartItems }}\" as=\"it\" hint-placeholder-count=\"2\">\n              <div style=\"display:grid;grid-template-columns:72px 1fr auto;gap:16px;align-items:center;padding:16px 0;border-bottom:1px solid #E4DCC9\">\n                <div style=\"width:72px;height:88px;background:repeating-linear-gradient(135deg,#EFEAE1,#EFEAE1 8px,#E4DCC9 8px,#E4DCC9 16px);border-radius:2px\"><\u002Fdiv>\n                <div>\n                  <div style=\"font-size:14px;font-weight:500\">{{ it.name }}<\u002Fdiv>\n                  <div style=\"font-size:12px;color:#8A8267;margin-bottom:8px\">{{ it.variant }}<\u002Fdiv>\n                  <div style=\"display:flex;align-items:center;gap:10px\">\n                    <div style=\"display:flex;align-items:center;border:1px solid #D9D2C4;border-radius:2px\">\n                      <button onclick=\"{{ it.onDec }}\" aria-label=\"Decrease\" style=\"width:28px;height:32px;border:none;background:none;cursor:pointer\">−<\u002Fbutton>\n                      <span style=\"width:24px;text-align:center;font-size:13px\">{{ it.qty }}<\u002Fspan>\n                      <button onclick=\"{{ it.onInc }}\" aria-label=\"Increase\" style=\"width:28px;height:32px;border:none;background:none;cursor:pointer\">+<\u002Fbutton>\n                    <\u002Fdiv>\n                    <button onclick=\"{{ it.onRemove }}\" style=\"background:none;border:none;color:#8A8267;font-size:12px;text-decoration:underline;cursor:pointer\">Remove<\u002Fbutton>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"font-size:14px;font-weight:500;text-align:right\">${{ it.lineTotal }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n\n            <sc-if value=\"{{ isB2B }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"background:#EFEAE1;border-radius:4px;padding:14px 16px;margin-top:16px;font-size:12px;color:#55503F\">Prices shown reflect your approved wholesale price list.<\u002Fdiv>\n            <\u002Fsc-if>\n\n            <div style=\"margin-top:24px\">\n              <div style=\"font-size:12px;font-weight:500;margin-bottom:8px\">Coupon code<\u002Fdiv>\n              <div style=\"display:flex;gap:8px;margin-bottom:10px\">\n                <input value=\"{{ couponInput }}\" onchange=\"{{ onCouponInputChange }}\" placeholder=\"Enter code\" style=\"flex:1;padding:9px 12px;border:1px solid #D9D2C4;border-radius:2px;font-family:'Work Sans',sans-serif;font-size:13px\">\n                <button onclick=\"{{ applyCoupon }}\" style=\"background:#17140F;color:#F5F3EE;border:none;padding:0 18px;border-radius:2px;cursor:pointer;font-size:13px\">Apply<\u002Fbutton>\n              <\u002Fdiv>\n              <sc-if value=\"{{ couponError }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"font-size:12px;color:#A63B2E;margin-bottom:10px\">{{ couponErrorText }}<\u002Fdiv>\n              <\u002Fsc-if>\n              <sc-for list=\"{{ coupons }}\" as=\"cp\" hint-placeholder-count=\"1\">\n                <div style=\"display:flex;justify-content:space-between;align-items:center;font-size:13px;background:#EFEAE1;padding:8px 12px;border-radius:2px;margin-bottom:6px\">\n                  <span>{{ cp.code }} — {{ cp.label }}<\u002Fspan>\n                  <button onclick=\"{{ cp.onRemove }}\" aria-label=\"Remove coupon\" style=\"border:none;background:none;color:#8A8267;cursor:pointer\">×<\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n              <button onclick=\"{{ demoStackError }}\" style=\"background:none;border:none;color:#8A8267;font-size:11px;text-decoration:underline;cursor:pointer;margin-top:6px\">demo: try a non-stackable coupon<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div>\n            <div style=\"background:#EFEAE1;border-radius:4px;padding:22px\">\n              <div style=\"display:flex;justify-content:space-between;font-size:13px;margin-bottom:10px\"><span>Subtotal<\u002Fspan><span>${{ subtotal }}<\u002Fspan><\u002Fdiv>\n              <div style=\"display:flex;justify-content:space-between;font-size:13px;margin-bottom:10px;color:#4B6C4F\"><span>Coupon discount<\u002Fspan><span>−${{ discount }}<\u002Fspan><\u002Fdiv>\n              <div style=\"display:flex;justify-content:space-between;font-size:13px;margin-bottom:10px\"><span>VAT (25%)<\u002Fspan><span>${{ vat }}<\u002Fspan><\u002Fdiv>\n              <div style=\"display:flex;justify-content:space-between;font-size:13px;margin-bottom:14px;color:#8A8267\"><span>Shipping<\u002Fspan><span>Calculated at checkout<\u002Fspan><\u002Fdiv>\n              <div style=\"display:flex;justify-content:space-between;font-size:17px;font-weight:500;padding-top:14px;border-top:1px solid #D9D2C4;margin-bottom:18px\"><span>Total<\u002Fspan><span>${{ total }}<\u002Fspan><\u002Fdiv>\n              <button onclick=\"{{ goCheckout }}\" style=\"width:100%;background:#17140F;color:#F5F3EE;border:none;padding:14px;font-size:14px;border-radius:2px;cursor:pointer\">Continue to checkout<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n      <button onclick=\"{{ toggleCartEmptyDemo }}\" style=\"background:none;border:none;color:#8A8267;font-size:11px;text-decoration:underline;cursor:pointer;margin-top:20px\">demo: toggle empty cart<\u002Fbutton>\n    <\u002Fsection>\n  <\u002Fsc-if>\n\n  <!-- ============ CHECKOUT ============ -->\n  <sc-if value=\"{{ isCheckout }}\" hint-placeholder-val=\"{{ false }}\">\n    <section data-screen-label=\"Checkout\" style=\"max-width:1040px;margin:0 auto;padding:40px 28px 64px\">\n      <h1 style=\"font-family:'Instrument Serif',serif;font-style:italic;fon <p style=\"font-size:13px;color:#8A8267;margin:0\">No items are eligible for return yet — returns open once an item ships.<\u002Fp>\n              <\u002Fsc-if>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ !orderReturnsEnabled }}\" hint-placeholder-val=\"{{ false }}\">\n              <p style=\"font-size:13px;color:#55503F;margin:0\">Returns for this order are handled by our team directly — email <a href=\"mailto:hello@alderandco.example\">hello@alderandco.example<\u002Fa> with your order number.<\u002Fp>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fsc-if>\n    <\u002Fsection>\n  <\u002Fsc-if>\n\n  <!-- ============ ACCOUNT ============ -->\n  <sc-if value=\"{{ isAccount }}\" hint-placeholder-val=\"{{ false }}\">\n    <section data-screen-label=\"Account\" style=\"max-width:520px;margin:0 auto;padding:40px 28px 64px\">\n      <div style=\"background:#EFEAE1;border-radius:4px;padding:14px 16px;margin-bottom:24px\">\n        <label style=\"font-size:12px;display:block;margin-bottom:4px\">Prototype: customer state<\u002Flabel>\n        <select value=\"{{ customerState }}\" onchange=\"{{ onCustomerStateSelect }}\" style=\"width:100%;padding:7px;border:1px solid #D9D2C4;border-radius:2px;font-size:12px\">\n          <option value=\"guest\">guest (logged out)<\u002Foption>\n          <option value=\"unverified\">registered — unverified<\u002Foption>\n          <option value=\"verified\">verified<\u002Foption>\n          <option value=\"business-pending\">business — pending approval<\u002Foption>\n          <option value=\"business-approved\">business — approved<\u002Foption>\n        <\u002Fselect>\n      <\u002Fdiv>\n\n      <sc-if value=\"{{ isGuest }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"display:flex;gap:4px;margin-bottom:24px;border-bottom:1px solid #E4DCC9\">\n          <sc-for list=\"{{ authTabs }}\" as=\"t\" hint-placeholder-count=\"3\">\n            <button onclick=\"{{ t.onClick }}\" style=\"background:none;border:none;padding:10px 14px;font-size:13px;cursor:pointer;color:{{ t.color }};border-bottom:2px solid {{ t.border }};margin-bottom:-1px\">{{ t.label }}<\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <sc-if value=\"{{ isLoginTab }}\" hint-placeholder-val=\"{{ true }}\">\n          <h1 style=\"font-family:'Instrument Serif',serif;font-style:italic;font-weight:400;font-size:26px;margin:0 0 20px\">Sign in<\u002Fh1>\n          <input placeholder=\"Email\" style=\"width:100%;padding:11px;border:1px solid #D9D2C4;border-radius:2px;font-family:'Work Sans',sans-serif;font-size:13px;margin-bottom:10px\">\n          <input placeholder=\"Password\" type=\"password\" style=\"width:100%;padding:11px;border:1px solid #D9D2C4;border-radius:2px;font-family:'Work Sans',sans-serif;font-size:13px;margin-bottom:10px\">\n          <div style=\"text-align:right;margin-bottom:16px\"><button onclick=\"{{ goForgot }}\" style=\"background:none;border:none;color:#A9895E;font-size:12px;cursor:pointer\">Forgot password?<\u002Fbutton><\u002Fdiv>\n          <button style=\"width:100%;background:#17140F;color:#F5F3EE;border:none;padding:13px;font-size:14px;border-radius:2px;cursor:pointer;margin-bottom:16px\">Sign in<\u002Fbutton>\n          <div style=\"display:flex;align-items:center;gap:10px;margin-bottom:16px\"><div style=\"flex:1;height:1px;background:#E4DCC9\"><\u002Fdiv><span style=\"font-size:11px;color:#8A8267\">or<\u002Fspan><div style=\"flex:1;height:1px;background:#E4DCC9\"><\u002Fdiv><\u002Fdiv>\n          <button style=\"width:100%;background:#fff;color:#17140F;border:1px solid #D9D2C4;padding:11px;font-size:13px;border-radius:2px;cursor:pointer;margin-bottom:8px\">Continue with Google<\u002Fbutton>\n          <button style=\"width:100%;background:#fff;color:#17140F;border:1px solid #D9D2C4;padding:11px;font-size:13px;border-radius:2px;cursor:pointer\">Continue with Apple<\u002Fbutton>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ isRegisterPersonalTab }}\" hint-placeholder-val=\"{{ false }}\">\n          <h1 style=\"font-family:'Instrument Serif',serif;font-style:italic;font-weight:400;font-size:26px;margin:0 0 20px\">Create account<\u002Fh1>\n          <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px\">\n            <input placeholder=\"First name\" style=\"padding:11px;border:1px solid #D9D2C4;border-radius:2px;font-family:'Work Sans',sans-serif;font-size:13px\">\n            <input placeholder=\"Last name\" style=\"padding:11px;border:1px solid #D9D2C4;border-radius:2px;font-family:'Work Sans',sans-serif;font-size:13px\">\n          <\u002Fdiv>\n          <input placeholder=\"Email\" style=\"width:100%;padding:11px;border:1px solid #D9D2C4;border-radius:2px;font-family:'Work Sans',sans-serif;font-size:13px;margin-bottom:10px\">\n          <input placeholder=\"Password\" type=\"password\" style=\"width:100%;padding:11px;border:1px solid #D9D2C4;border-radius:2px;font-family:'Work Sans',sans-serif;font-size:13px;margin-bottom:16px\">\n          <button onclick=\"{{ registerAsUnverified }}\" style=\"width:100%;background:#17140F;color:#F5F3EE;border:none;padding:13px;font-size:14px;border-radius:2px;cursor:pointer\">Create account<\u002Fbutton>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ isRegisterBusinessTab }}\" hint-placeholder-val=\"{{ false }}\">\n          <h1 style=\"font-family:'Instrument Serif',serif;font-style:italic;font-weight:400;font-size:26px;margin:0 0 8px\">Business account<\u002Fh1>\n          <p style=\"font-size:12px;color:#8A8267;margin:0 0 18px\">Approved businesses buy at wholesale price lists. Approval takes 1–2 business days.<\u002Fp>\n          <input placeholder=\"Company name\" style=\"width:100%;padding:11px;border:1px solid #D9D2C4;border-radius:2px;font-family:'Work Sans',sans-serif;font-size:13px;margin-bottom:10px\">\n          <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px\">\n            <input placeholder=\"OIB\" style=\"padding:11px;border:1px solid #D9D2C4;border-radius:2px;font-family:'Work Sans',sans-serif;font-size:13px\">\n            <input placeholder=\"VAT ID\" style=\"padding:11px;border:1px solid #D9D2C4;border-radius:2px;font-family:'Work Sans',sans-serif;font-size:13px\">\n          <\u002Fdiv>\n          <input placeholder=\"Business email\" style=\"width:100%;padding:11px;border:1px solid #D9D2C4;border-radius:2px;font-family:'Work Sans',sans-serif;font-size:13px;margin-bottom:16px\">\n          <button onclick=\"{{ registerAsBusinessPending }}\" style=\"width:100%;background:#17140F;color:#F5F3EE;border:none;padding:13px;font-size:14px;border-radius:2px;cursor:pointer\">Submit for approval<\u002Fbutton>\n        <\u002Fsc-if>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ !isGuest }}\" hint-placeholder-val=\"{{ false }}\">\n        <h1 style=\"font-family:'Instrument Serif',serif;font-style:italic;font-weight:400;font-size:26px;margin:0 0 20px\">My account<\u002Fh1>\n\n        <sc-if value=\"{{ isUnverified }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"background:#F3E7CE;border-radius:4px;padding:14px 16px;margin-bottom:20px;font-size:13px;color:#7A5A17\">\n            Verify your email to unlock wishlist sync, reviews, saved addresses and order history.\n            <button onclick=\"{{ goVerify }}\" style=\"display:block;margin-top:8px;background:none;border:none;color:#7A5A17;text-decoration:underline;cursor:pointer;font-size:12px\">Resend verification email<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ isBusinessPending }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"background:#F3E7CE;border-radius:4px;padding:14px 16px;margin-bottom:20px;font-size:13px;color:#7A5A17\">Your business account is pending approval. You're currently buying at standard retail pricing — wholesale pricing unlocks once approved.<\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ isBusinessApproved }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"background:#DCEADD;border-radius:4px;padding:14px 16px;margin-bottom:20px;font-size:13px;color:#2E4A31\">Business account approved — wholesale price list applied across catalog, cart and checkout.<\u002Fdiv>\n        <\u002Fsc-if>\n\n        <div style=\"border:1px solid #D9D2C4;border-radius:4px;padding:18px;margin-bottom:16px\">\n          <div style=\"font-size:14px;font-weight:500;margin-bottom:2px\">{{ accountName }}<\u002Fdiv>\n          <div style=\"font-size:12px;color:#8A8267;margin-bottom:12px\">{{ accountEmail }}<\u002Fdiv>\n          <div style=\"font-size:12px;color:#55503F\">Marketing emails: {{ marketingStatus }}<\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display:flex;flex-direction:column;gap:2px;margin-bottom:20px\">\n          <sc-for list=\"{{ accountLinks }}\" as=\"l\" hint-placeholder-count=\"4\">\n            <button onclick=\"{{ l.onClick }}\" style=\"text-align:left;background:none;border:none;padding:12px 4px;font-size:13px;cursor:pointer;border-bottom:1px solid #E4DCC9;color:#17140F\">{{ l.label }} →<\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <button style=\"background:none;border:1px solid #D9D2C4;padding:10px 18px;font-size:13px;border-radius:2px;cursor:pointer;margin-right:10px\">Change password<\u002Fbutton>\n        <button onclick=\"{{ logout }}\" style=\"background:none;border:1px solid #D9D2C4;padding:10px 18px;font-size:13px;border-radius:2px;cursor:pointer\">Log out<\u002Fbutton>\n      <\u002Fsc-if>\n    <\u002Fsection>\n  <\u002Fsc-if>\n\n  <!-- ============ ADDRESS BOOK ============ -->\n  <sc-if value=\"{{ isAddresses }}\" hint-placeholder-val=\"{{ false }}\">\n    <section data-screen-label=\"Address book\" style=\"max-width:640px;margin:0 auto;padding:40px 28px 64px\">\n      <h1 style=\"font-family:'Instrument Serif',serif;font-style:italic;font-weight:400;font-size:28px;margin:0 0 24px\">Address book<\u002Fh1>\n      <sc-for list=\"{{ addresses }}\" as=\"ad\" hint-placeholder-count=\"2\">\n        <div style=\"border:1px solid #D9D2C4;border-radius:4px;padding:16px 18px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:flex-start\">\n          <div>\n            <div style=\"display:flex;gap:6px;margin-bottom:6px\">\n              <sc-if value=\"{{ ad.isDefaultShip }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"font-size:10px;background:#EFEAE1;padding:3px 8px;border-radius:2px\">Default shipping<\u002Fspan><\u002Fsc-if>\n              <sc-if value=\"{{ ad.isDefaultBill }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"font-size:10px;background:#EFEAE1;padding:3px 8px;border-radius:2px\">Default billing<\u002Fspan><\u002Fsc-if>\n            <\u002Fdiv>\n            <div style=\"font-size:13px;font-weight:500\">{{ ad.name }}<\u002Fdiv>\n            <div style=\"font-size:13px;color:#55503F;line-height:1.5\">{{ ad.line }}<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;gap:10px;font-size:12px\">\n            <button style=\"background:none;border:none;color:#A9895E;cursor:pointer\">Edit<\u002Fbutton>\n            <button style=\"background:none;border:none;color:#A63B2E;cursor:pointer\">Delete<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n      <button style=\"background:#17140F;color:#F5F3EE;border:none;padding:12px 20px;font-size:13px;border-radius:2px;cursor:pointer;margin-top:8px\">Add new address<\u002Fbutton>\n    <\u002Fsection>\n  <\u002Fsc-if>\n\n  <!-- ============ ORDER HISTORY ============ -->\n  <sc-if value=\"{{ isOrders }}\" hint-placeholder-val=\"{{ false }}\">\n    <section data-screen-label=\"Order history\" style=\"max-width:760px;margin:0 auto;padding:40px 28px 64px\">\n      <h1 style=\"font-family:'Instrument Serif',serif;font-style:italic;font-weight:400;font-size:28px;margin:0 0 24px\">Order history<\u002Fh1>\n      <sc-if value=\"{{ ordersEmpty }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"text-align:center;padding:56px 24px;border:1px dashed #D9D2C4;border-radius:4px\">\n          <div style=\"font-size:15px;margin-bottom:12px\">No orders yet<\u002Fdiv>\n          <button onclick=\"{{ goCatalog }}\" style=\"background:#17140F;color:#F5F3EE;border:none;padding:11px 20px;font-size:13px;border-radius:2px;cursor:pointer\">Start shopping<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ !ordersEmpty }}\" hint-placeholder-val=\"{{ true }}\">\n        <sc-for list=\"{{ orderHistory }}\" as=\"ord\" hint-placeholder-count=\"3\">\n          <button onclick=\"{{ ord.onClick }}\" style=\"width:100%;text-align:left;display:flex;justify-content:space-between;align-items:center;border:1px solid #D9D2C4;border-radius:4px;padding:16px 18px;margin-bottom:10px;background:none;cursor:pointer;font-family:'Work Sans',sans-serif\">\n            <div>\n              <div style=\"font-size:13px;font-weight:500\">{{ ord.number }}<\u002Fdiv>\n              <div style=\"font-size:12px;color:#8A8267\">{{ ord.date }} · {{ ord.itemCount }} items<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:flex;align-items:center;gap:10px\">\n              <span style=\"font-size:11px;background:{{ ord.bg }};color:{{ ord.fg }};padding:4px 9px;border-radius:2px;text-transform:capitalize\">{{ ord.status }}<\u002Fspan>\n              <span style=\"font-size:13px;font-weight:500\">${{ ord.total }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fsc-if>\n    <\u002Fsection>\n  <\u002Fsc-if>\n\n  <!-- ============ WISHLIST ============ -->\n  <sc-if value=\"{{ isWishlist }}\" hint-placeholder-val=\"{{ false }}\">\n    <section data-screen-label=\"Wishlist\" style=\"max-width:1000px;margin:0 auto;padding:40px 28px 64px\">\n      <h1 style=\"font-family:'Instrument Serif',serif;font-style:italic;font-weight:400;font-size:28px;margin:0 0 8px\">Wishlist<\u002Fh1>\n      <p style=\"font-size:12px;color:#8A8267;margin:0 0 24px\">{{ wishlistSyncNote }}<\u002Fp>\n      <div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:20px\">\n        <sc-for list=\"{{ wishlistProducts }}\" as=\"prod\" hint-placeholder-count=\"3\">\n          <dc-import name=\"ProductCard\" product=\"{{ prod }}\" on-open=\"{{ prod.onOpen }}\" hint-size=\"100%,320px\"><\u002Fdc-import>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fsection>\n  <\u002Fsc-if>\n\n  <!-- ============ FORGOT PASSWORD ============ -->\n  <sc-if value=\"{{ isForgot }}\" hint-placeholder-val=\"{{ false }}\">\n    <section data-screen-label=\"Forgot password\" style=\"max-width:420px;margin:0 auto;padding:64px 28px\">\n      <h1 style=\"font-family:'Instrument Serif',serif;font-style:italic;font-weight:400;font-size:26px;margin:0 0 10px\">Reset your password<\u002Fh1>\n      <p style=\"font-size:13px;color:#55503F;margin:0 0 20px\">We'll email you a link to set a new password.<\u002Fp>\n      <input placeholder=\"Email\" style=\"width:100%;padding:11px;border:1px solid #D9D2C4;border-radius:2px;font-family:'Work Sans',sans-serif;font-size:13px;margin-bottom:16px\">\n      <button style=\"width:100%;background:#17140F;color:#F5F3EE;border:none;padding:13px;font-size:14px;border-radius:2px;cursor:pointer\">Send reset link<\u002Fbutton>\n    <\u002Fsection>\n  <\u002Fsc-if>\n\n  <!-- ============ RESET PASSWORD ============ -->\n  <sc-if value=\"{{ isReset }}\" hint-placeholder-val=\"{{ false }}\">\n    <section data-screen-label=\"Reset password\" style=\"max-width:420px;margin:0 auto;padding:64px 28px\">\n      <div style=\"margin-bottom:16px\">\n        <label style=\"font-size:12px;display:flex;align-items:center;gap:6px\"><input type=\"checkbox\" checked=\"{{ resetTokenValid }}\" onchange=\"{{ toggleResetTokenValid }}\"> demo: token valid<\u002Flabel>\n      <\u002Fdiv>\n      <sc-if value=\"{{ resetTokenValid }}\" hint-placeholder-val=\"{{ true }}\">\n        <h1 style=\"font-family:'Instrument Serif',serif;font-style:italic;font-weight:400;font-size:26px;margin:0 0 20px\">Set a new password<\u002Fh1>\n        <input placeholder=\"New password\" type=\"password\" style=\"width:100%;padding:11px;border:1px solid #D9D2C4;border-radius:2px;font-family:'Work Sans',sans-serif;font-size:13px;margin-bottom:10px\">\n        <input placeholder=\"Confirm password\" type=\"password\" style=\"width:100%;padding:11px;border:1px solid #D9D2C4;border-radius:2px;font-family:'Work Sans',sans-serif;font-size:13px;margin-bottom:16px\">\n        <button style=\"width:100%;background:#17140F;color:#F5F3EE;border:none;padding:13px;font-size:14px;border-radius:2px;cursor:pointer\">Set password<\u002Fbutton>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ !resetTokenValid }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"text-align:center;padding:32px 12px\">\n          <div style=\"font-size:15px;margin-bottom:8px\">This link has expired<\u002Fdiv>\n          <button onclick=\"{{ goForgot }}\" style=\"background:#17140F;color:#F5F3EE;border:none;padding:11px 20px;font-size:13px;border-radius:2px;cursor:pointer\">Request a new link<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fsection>\n  <\u002Fsc-if>\n\n  <!-- ============ VERIFY EMAIL ============ -->\n  <sc-if value=\"{{ isVerify }}\" hint-placeholder-val=\"{{ false }}\">\n    <section data-screen-label=\"Verify email\" style=\"max-width:420px;margin:0 auto;padding:64px 28px;text-align:center\">\n      <div style=\"margin-bottom:16px;text-align:left\">\n        <label style=\"font-size:12px;display:flex;align-items:center;gap:6px\"><input type=\"checkbox\" checked=\"{{ verifySucceeded }}\" onchange=\"{{ toggleVerifySucceeded }}\"> demo: verification succeeds<\u002Flabel>\n      <\u002Fdiv>\n      <sc-if value=\"{{ verifySucceeded }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"font-size:15px;margin-bottom:8px\">Your email is verified<\u002Fdiv>\n        <p style=\"font-size:13px;color:#55503F;margin:0 0 16px\">Wishlist sync, reviews, addresses and order history are now unlocked.<\u002Fp>\n        <button onclick=\"{{ goAccountScreen }}\" style=\"background:#17140F;color:#F5F3EE;border:none;padding:11px 20px;font-size:13px;border-radius:2px;cursor:pointer\">Go to account<\u002Fbutton>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ !verifySucceeded }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"font-size:15px;margin-bottom:8px\">This verification link is invalid or expired<\u002Fdiv>\n        <button style=\"background:none;border:1px solid #17140F;padding:11px 20px;font-size:13px;border-radius:2px;cursor:pointer\">Resend verification email<\u002Fbutton>\n      <\u002Fsc-if>\n    <\u002Fsection>\n  <\u002Fsc-if>\n\n  <!-- ============ CMS PAGE ============ -->\n  <sc-if value=\"{{ isCms }}\" hint-placeholder-val=\"{{ false }}\">\n    <section data-screen-label=\"CMS page\" style=\"max-width:680px;margin:0 auto;padding:48px 28px 64px\">\n      <nav aria-label=\"Breadcrumb\" style=\"font-size:12px;color:#8A8267;margin-bottom:20px\"><a href=\"#\" onclick=\"{{ goHome }}\" style=\"color:#8A8267;text-decoration:none\">Home<\u002Fa> / <span style=\"color:#17140F\">About<\u002Fspan><\u002Fnav>\n      <h1 style=\"font-family:'Instrument Serif',serif;font-style:italic;font-weight:400;font-size:34px;margin:0 0 20px\">Our story<\u002Fh1>\n      <p style=\"font-size:15px;line-height:1.8;color:#3A362B;margin:0 0 20px\">Alder &amp; Co started in a single tailoring workshop in 2014. We still cut most of our outerwear in-house, and everything we make is designed to be repaired rather than replaced.<\u002Fp>\n      <div style=\"aspect-ratio:16/9;background:repeating-linear-gradient(135deg,#EFEAE1,#EFEAE1 12px,#E4DCC9 12px,#E4DCC9 24px);border-radius:2px;display:flex;align-items:center;justify-content:center;font-family:monospace;font-size:12px;color:#8A8267;margin-bottom:24px\">editor-placed gallery block<\u002Fdiv>\n      <p style=\"font-size:15px;line-height:1.8;color:#3A362B;margin:0\">This page is built from editor content blocks — text, images and galleries — so its length and structure vary page to page. Typography and spacing here define the system for all CMS-authored pages, not a fixed layout.<\u002Fp>\n    <\u002Fsection>\n  <\u002Fsc-if>\n\n  <!-- ============ 404 ============ -->\n  <sc-if value=\"{{ isNotFound }}\" hint-placeholder-val=\"{{ false }}\">\n    <section data-screen-label=\"404\" style=\"max-width:480px;margin:0 auto;padding:96px 28px;text-align:center\">\n      <div style=\"font-family:'Instrument Serif',serif;font-style:italic;font-size:64px;margin-bottom:8px;color:#D9D2C4\">404<\u002Fdiv>\n      <div style=\"font-size:16px;margin-bottom:8px\">Page not found<\u002Fdiv>\n      <p style=\"font-size:13px;color:#8A8267;margin:0 0 20px\">The page you're looking for may have been moved or renamed.<\u002Fp>\n      <button onclick=\"{{ goHome }}\" style=\"background:#17140F;color:#F5F3EE;border:none;padding:12px 22px;font-size:13px;border-radius:2px;cursor:pointer\">Back to home<\u002Fbutton>\n    <\u002Fsection>\n  <\u002Fsc-if>\n\n  <\u002Fmain>\n\n  <dc-import name=\"Footer\" locale=\"{{ locale }}\" navigate=\"{{ navigate }}\" hint-size=\"100%,260px\"><\u002Fdc-import>\n\n  <sc-if value=\"{{ showCookieBanner }}\" hint-placeholder-val=\"{{ false }}\">\n    <div role=\"region\" aria-label=\"Cookie consent\" style=\"position:fixed;left:20px;right:20px;bottom:20px;max-width:520px;background:#17140F;color:#EFEAE1;padding:20px 22px;border-radius:6px;box-shadow:0 12px 32px rgba(0,0,0,0.25);z-index:80;font-family:'Work Sans',sans-serif\">\n      <div style=\"font-size:13px;line-height:1.6;margin-bottom:14px;color:#D9D2C4\">We use analytics cookies to understand shop traffic. Accept to enable, or continue with essential cookies only.<\u002Fdiv>\n      <div style=\"display:flex;gap:10px\">\n        <button onclick=\"{{ acceptCookies }}\" style=\"background:#F5F3EE;color:#17140F;border:none;padding:9px 18px;font-size:13px;border-radius:2px;cursor:pointer\">Accept<\u002Fbutton>\n        <button onclick=\"{{ declineCookies }}\" style=\"background:transparent;color:#EFEAE1;border:1px solid #55503F;padding:9px 18px;font-size:13px;border-radius:2px;cursor:pointer\">Decline<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <div style=\"position:fixed;bottom:16px;right:16px;z-index:90;background:#fff;border:1px solid #D9D2C4;border-radius:8px;padding:10px 12px;box-shadow:0 4px 16px rgba(0,0,0,0.12);font-family:'Work Sans',sans-serif;max-width:220px\">\n    <div style=\"font-size:10px;letter-spacing:0.06em;text-transform:uppercase;color:#8A8267;margin-bottom:6px\">Prototype — jump to screen<\u002Fdiv>\n    <select value=\"{{ screen }}\" onchange=\"{{ onScreenSelect }}\" style=\"width:100%;font-size:12px;padding:6px;border:1px solid #D9D2C4;border-radius:4px;font-family:'Work Sans',sans-serif\">\n      <sc-for list=\"{{ screenOptions }}\" as=\"opt\" hint-placeholder-count=\"6\">\n        <option value=\"{{ opt.value }}\">{{ opt.label }}<\u002Foption>\n      <\u002Fsc-for>\n    <\u002Fselect>\n  <\u002Fdiv>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nconst PRODUCTS = [\n  { id: 'oxford-shirt', name: 'Field Oxford Shirt', category: 'Men / Shirts', kind: 'physical', price: 128, compareAt: 148, lowest30: 118, options: { Size: ['XS','S','M','L','XL'], Color: ['White','Ecru'] }, stock: 'in', desc: 'A washed cotton oxford, cut with a slightly relaxed collar roll.' },\n  { id: 'weekend-chino', name: 'Weekend Chino', category: 'Men / Trousers', kind: 'physical', price: 138, options: { Size: ['28','30','32','34','36','38'], Color: ['Olive','Sand','Black'] }, stock: 'in', desc: 'Mid-weight cotton twill, tapered through the leg.' },\n  { id: 'wool-overcoat', name: 'Alder Wool Overcoat', category: 'Men / Outerwear', kind: 'physical', price: 420, options: { Size: ['S','M','L','XL'], Color: ['Charcoal'] }, stock: 'out', desc: 'Double-faced wool, half-lined, horn buttons.' },\n  { id: 'mtm-suit', name: 'Made-to-Measure Suit', category: 'Men / Tailoring', kind: 'inquiry', desc: 'Fully canvassed, cut to your measurements. Submit an inquiry and our tailor will follow up.' },\n  { id: 'style-guide-pdf', name: 'Digital Style Guide', category: 'Guides', kind: 'digital', price: 12, desc: 'A 40-page PDF on building a considered wardrobe. Delivered instantly.' },\n  { id: 'gift-card', name: 'Alder Gift Card', category: 'Gift Cards', kind: 'digital', price: 100, options: { Amount: ['$50','$100','$200'] }, desc: 'Delivered by email, redeemable storewide, no expiry.' },\n  { id: 'boat-neck-tee', name: 'Boat Neck Tee', category: 'Women / Knitwear', kind: 'physical', price: 58, compareAt: 72, lowest30: 58, options: { Size: ['XS','S','M','L'], Color: ['Ecru','Black'] }, stock: 'in', desc: 'Heavyweight cotton jersey, boxy fit.' },\n  { id: 'selvedge-jacket', name: 'Selvedge Denim Jacket', category: 'Men / Outerwear', kind: 'physical', price: 245, b2bPrice: 165, options: { Size: ['S','M','L','XL'], Color: ['Indigo'] }, stock: 'in', desc: 'Japanese selvedge denim, unwashed, sold both retail and wholesale.' },\n];\n\nconst CATEGORIES = [\n  { label: 'Men', image: 'category — men', children: ['Shirts','Trousers','Outerwear','Tailoring'] },\n  { label: 'Women', image: 'category — women', children: ['Dresses','Knitwear','Outerwear'] },\n  { label: 'Accessories', image: 'category — accessories', children: ['Belts','Bags'] },\n  { label: 'Gift Cards', image: 'category — gift cards', children: [] },\n];\n\nclass Component extends DCLogic {\n  state = {\n    screen: 'home',\n    locale: 'en',\n    customerState: 'guest',\n    showCookieBanner: true,\n    cart: {\n      items: [\n        { id: 'oxford-shirt', variant: 'M / White', price: 128, qty: 1 },\n        { id: 'selvedge-jacket', variant: 'L / Indigo', price: 245, qty: 1 },\n      ],\n      coupons: [ { code: 'WELCOME10', label: '10% off order' } ],\n      couponError: null,\n      empty: false,\n    },\n    productView: 'oxford-shirt',\n    productVariant: { Size: 'M', Color: 'White' },\n    productOutOfStockOverride: false,\n    accountTab: 'login',\n    order: {\n      paymentStatus: 'awaiting_payment',\n      fulfillmentStatus: 'unfulfilled',\n      paymentMode: 'pay_now',\n      quoteMode: false,\n      returnsEnabled: true,\n      tokenState: 'found',\n    },\n    checkout: {\n      digitalOnly: false,\n      paymentMode: 'pay_now',\n      showErrors: false,\n      quoteDivert: false,\n    },\n    catalog: { sort: 'featured', search: '', showEmptyDemo: false },\n  };\n\n  navigate = (screen) => { window.scrollTo(0,0); this.setState({ screen }); };\n\n  renderVals() {\n    const s = this.state;\n    const navigate = this.navigate;\n\n    const usps = [\n      { title: 'Free shipping over $150', sub: 'US & EU' },\n      { title: 'Made-to-measure', sub: 'By appointment' },\n      { title: 'Responsibly sourced', sub: 'Traceable mills' },\n      { title: '30-day returns', sub: 'No questions asked' },\n    ];\n\n    const categoryCards = CATEGORIES.map(c => ({\n      label: c.label, image: c.image, onClick: (e) => { e.preventDefault(); navigate('catalog'); },\n    }));\n\n    const featuredProducts = PRODUCTS.slice(0, 4).map(p => ({\n      ...p, onOpen: () => { this.setState({ productView: p.id }); navigate('product'); },\n    }));\n\n    const screenOptions = [\n      { value: 'home', label: 'Home' },\n      { value: 'catalog', label: 'Catalog' },\n      { value: 'product', label: 'Product detail' },\n      { value: 'cart', label: 'Cart' },\n      { value: 'checkout', label: 'Checkout' },\n      { value: 'order', label: 'Order page' },\n      { value: 'account', label: 'Account / login' },\n      { value: 'addresses', label: 'Address book' },\n      { value: 'orders', label: 'Order history' },\n      { value: 'wishlist', label: 'Wishlist' },\n      { value: 'forgot', label: 'Forgot password' },\n      { value: 'reset', label: 'Reset password' },\n      { value: 'verify', label: 'Verify email' },\n      { value: 'cms', label: 'CMS page (About)' },\n      { value: 'notfound', label: '404' },\n    ];\n\n    const cartCount = s.cart.empty ? 0 : s.cart.items.reduce((a,i)=>a+i.qty,0);\n\n    return {\n      screen: s.screen,\n      isHome: s.screen === 'home',\n      locale: s.locale,\n      customerState: s.customerState,\n      cartCount,\n      navigate,\n      setLocale: (l) => this.setState({ locale: l }),\n      goCatalog: () => navigate('catalog'),\n      goCms: () => navigate('cms'),\n      goCart: () => navigate('cart'),\n      usps,\n      categoryCards,\n      featuredProducts,\n      screenOptions,\n      onScreenSelect: (e) => this.setState({ screen: e.target.value }),\n      showCookieBanner: s.showCookieBanner,\n      acceptCookies: () => this.setState({ showCookieBanner: false }),\n      declineCookies: () => this.setState({ showCookieBanner: false }),\n\n      // ---- Catalog ----\n      isCatalog: s.screen === 'catalog',\n      catalogTitle: 'Shop All',\n      searchQuery: s.catalog.search,\n      onSearchChange: (e) => this.setState(st => ({ catalog: { ...st.catalog, search: e.target.value } })),\n      sortValue: s.catalog.sort,\n      onSortChange: (e) => this.setState(st => ({ catalog: { ...st.catalog, sort: e.target.value } })),\n      resultCount: s.catalog.showEmptyDemo ? 0 : PRODUCTS.length,\n      hasActiveFilters: true,\n      filterChips: [\n        { label: 'In stock only', onRemove: () => {} },\n        { label: 'Under $450', onRemove: () => {} },\n      ],\n      showEmptyState: s.catalog.showEmptyDemo,\n      toggleEmptyDemo: () => this.setState(st => ({ catalog: { ...st.catalog, showEmptyDemo: !st.catalog.showEmptyDemo } })),\n      catalogProducts: PRODUCTS.map(p => ({ ...p, onOpen: () => { this.setState({ productView: p.id }); navigate('product'); } })),\n      pages: [1,2,3].map(n => ({ label: String(n), border: n===1?'#17140F':'#D9D2C4', bg: n===1?'#17140F':'transparent', fg: n===1?'#F5F3EE':'#17140F', onClick: () => {} })),\n      goHome: () => navigate('home'),\n\n      // ---- Product detail ----\n      ...this.productDetailVals(),\n    };\n  }\n\n  productDetailVals() {\n    const s = this.state;\n    const navigate = this.navigate;\n    const prod = PRODUCTS.find(p => p.id === s.productView) || PRODUCTS[0];\n    const kind = prod.kind;\n    const inStock = kind !== 'physical' ? true : (s.productOutOfStockOverride ? false : prod.stock === 'in');\n    const priceVal = prod.b2bPrice ?? prod.price;\n\n    const optionGroups = kind === 'physical' && prod.options ? Object.keys(prod.options).map(groupName => {\n      const values = prod.options[groupName];\n      const selected = s.productVariant[groupName] || values[0];\n      return {\n        name: groupName,\n        selected,\n        values: values.map(v => {\n          const pressed = v === selected;\n          return {\n            label: v, pressed,\n            border: pressed ? '#17140F' : '#D9D2C4', bg: pressed ? '#17140F' : 'transparent', fg: pressed ? '#F5F3EE' : '#17140F',\n            onClick: () => this.setState(st => ({ productVariant: { ...st.productVariant, [groupName]: v } })),\n          };\n        }),\n      };\n    }) : (kind === 'digital' && prod.options ? Object.keys(prod.options).map(groupName => {\n      const values = prod.options[groupName];\n      const selected = s.productVariant[groupName] || values[0];\n      return { name: groupName, selected, values: values.map(v => ({ label: v, pressed: v===selected, border: v===selected?'#17140F':'#D9D2C4', bg: v===selected?'#17140F':'transparent', fg: v===selected?'#F5F3EE':'#17140F', onClick: () => this.setState(st => ({ productVariant: { ...st.productVariant, [groupName]: v } })) })) };\n    }) : []);\n\n    return {\n      isProduct: s.screen === 'product',\n      pCategory: prod.category,\n      pName: prod.name,\n      pDesc: prod.desc,\n      thumbs: [1,2,3,4].map(i => ({ bg: i === 1 ? '#E4DCC9' : '#EFEAE1' })),\n      isInquiryProduct: kind === 'inquiry',\n      pHasCompareAt: !!prod.compareAt,\n      pCompareAtLabel: prod.compareAt ? ('$' + prod.compareAt) : '',\n      pLowest30Label: prod.lowest30 ? ('$' + prod.lowest30) : '',\n      pIsB2B: s.customerState === 'business-approved' && !!prod.b2bPrice,\n      pPriceLabel: priceVal != null ? ('$' + priceVal) : '',\n      optionGroups,\n      pInStock: inStock,\n      pSku: prod.id.toUpperCase().replace(/-/g,'') + '-' + (s.productVariant.Size || s.productVariant.Amount || '01'),\n      qty: s.productQty || 1,\n      incQty: () => this.setState(st => ({ productQty: (st.productQty||1) + 1 })),\n      decQty: () => this.setState(st => ({ productQty: Math.max(1, (st.productQty||1) - 1) })),\n      addToCart: () => this.setState(st => ({ cart: { ...st.cart, empty: false, items: [...st.cart.items, { id: prod.id, variant: Object.values(st.productVariant).join(' / ') || 'Default', price: priceVal, qty: st.productQty || 1 }] } })),\n      toggleStockDemo: () => this.setState(st => ({ productOutOfStockOverride: !st.productOutOfStockOverride })),\n      reviewCount: 27,\n      reviews: [\n        { name: 'Marko P.', stars: '★★★★★', date: 'Jun 2026', verified: true, text: 'Fits true to size, fabric feels like it will last for years.' },\n        { name: 'Ana K.', stars: '★★★★☆', date: 'May 2026', verified: true, text: 'Great quality, wish there were more colors.' },\n      ],\n      ...this.cartVals(),\n    };\n  }\n\n  cartVals() {\n    const s = this.state;\n    const navigate = this.navigate;\n    const cartEmpty = s.cart.empty || s.cart.items.length === 0;\n    const findProd = (id) => PRODUCTS.find(p => p.id === id) || {};\n    const cartItems = s.cart.items.map((it, idx) => {\n      const prod = findProd(it.id);\n      return {\n        name: prod.name || it.id,\n        variant: it.variant,\n        qty: it.qty,\n        lineTotal: it.price * it.qty,\n        onInc: () => this.setState(st => ({ cart: { ...st.cart, items: st.cart.items.map((x,i) => i===idx ? { ...x, qty: x.qty+1 } : x) } })),\n        onDec: () => this.setState(st => ({ cart: { ...st.cart, items: st.cart.items.map((x,i) => i===idx && x.qty>1 ? { ...x, qty: x.qty-1 } : x) } })),\n        onRemove: () => this.setState(st => ({ cart: { ...st.cart, items: st.cart.items.filter((_,i) => i!==idx) } })),\n      };\n    });\n    const subtotal = s.cart.items.reduce((a,it) => a + it.price*it.qty, 0);\n    const discountRate = s.cart.coupons.length ? 0.10 : 0;\n    const discount = Math.round(subtotal * discountRate);\n    const vat = Math.round((subtotal - discount) * 0.25);\n    const total = subtotal - discount + vat;\n\n    return {\n      isCart: s.screen === 'cart',\n      cartIsEmpty: cartEmpty,\n      cartItems,\n      isB2B: s.customerState === 'business-approved',\n      couponInput: s.couponInput || '',\n      onCouponInputChange: (e) => this.setState({ couponInput: e.target.value }),\n      couponError: !!s.cart.couponError,\n      couponErrorText: s.cart.couponError,\n      coupons: s.cart.coupons.map(c => ({ code: c.code, label: c.label, onRemove: () => this.setState(st => ({ cart: { ...st.cart, coupons: st.cart.coupons.filter(x=>x.code!==c.code) } })) })),\n      applyCoupon: () => this.setState(st => ({ cart: { ...st.cart, coupons: st.couponInput ? [...st.cart.coupons, { code: st.couponInput.toUpperCase(), label: 'Discount applied' }] : st.cart.coupons, couponError: null }, couponInput: '' })),\n      demoStackError: () => this.setState(st => ({ cart: { ...st.cart, couponError: 'Code \"SUMMER20\" cannot be combined with WELCOME10 (not stackable).' } })),\n      subtotal, discount, vat, total,\n      goCheckout: () => navigate('checkout'),\n      toggleCartEmptyDemo: () => this.setState(st => ({ cart: { ...st.cart, empty: !st.cart.empty } })),\n      ...this.checkoutVals(subtotal, discount, vat, total),\n    };\n  }\n\n  checkoutVals(subtotal, discount, vat, total) {\n    const s = this.state;\n    const navigate = this.navigate;\n    const c = s.checkout;\n    const shippingCost = c.digitalOnly ? 0 : (c.paymentMode === 'cod' ? 12 : 8);\n    const checkoutTotal = (subtotal - discount) + vat + shippingCost + (c.paymentMode === 'cod' ? 4 : 0);\n\n    return {\n      isCheckout: s.screen === 'checkout',\n      digitalOnly: c.digitalOnly,\n      toggleDigitalOnly: () => this.setState(st => ({ checkout: { ...st.checkout, digitalOnly: !st.checkout.digitalOnly } })),\n      showErrors: c.showErrors,\n      toggleShowErrors: () => this.setState(st => ({ checkout: { ...st.checkout, showErrors: !st.checkout.showErrors } })),\n      quoteDivert: c.quoteDivert,\n      toggleQuoteDivert: () => this.setState(st => ({ checkout: { ...st.checkout, quoteDivert: !st.checkout.quoteDivert } })),\n      errBorder: c.showErrors ? '#A63B2E' : '#D9D2C4',\n      isVerified: s.customerState === 'verified' || s.customerState === 'business-approved',\n      shippingMethods: [\n        { name: 'Standard', eta: '4–6 days', price: '$8', checked: true, border: '#17140F', onSelect: () => {} },\n        { name: 'Express', eta: '1–2 days', price: '$22', checked: false, border: '#D9D2C4', onSelect: () => {} },\n        { name: 'Cash on delivery pickup', eta: '4–6 days', price: '$12 + COD fee', checked: false, border: '#D9D2C4', onSelect: () => {} },\n      ],\n      paymentModes: ['pay_now','bank_transfer','cod'].map(mode => {\n        const checked = c.paymentMode === mode;\n        const labels = { pay_now: 'Pay now — card', bank_transfer: 'Bank transfer', cod: 'Cash on delivery' };\n        const notes = { pay_now: 'Stripe', bank_transfer: 'Pay by IBAN', cod: '+$4 surcharge' };\n        const details = {\n          pay_now: '[Stripe card element mounts here]',\n          bank_transfer: 'Instructions with IBAN and order reference are shown after you place the order.',\n          cod: 'Pay the courier in cash on delivery. A $4 handling surcharge applies.',\n        };\n        return { label: labels[mode], note: notes[mode], detail: details[mode], checked, expanded: checked, border: checked ? '#17140F' : '#D9D2C4', onSelect: () => this.setState(st => ({ checkout: { ...st.checkout, paymentMode: mode } })) };\n      }),\n      subtotal, vat, checkoutTotal,\n      shippingLineLabel: c.digitalOnly ? 'None (digital)' : ('$' + shippingCost),\n      goOrder: () => navigate('order'),\n      ...this.orderVals(),\n    };\n  }\n\n  orderVals() {\n    const s = this.state;\n    const o = this.state.order;\n    const statusColors = {\n      awaiting_payment: { bg: '#F3E7CE', fg: '#7A5A17' },\n      paid: { bg: '#DCEADD', fg: '#2E4A31' },\n      refunded: { bg: '#E3E1F0', fg: '#413A6B' },\n      failed: { bg: '#F3D9D3', fg: '#7A2E1E' },\n      unfulfilled: { bg: '#EFEAE1', fg: '#55503F' },\n      partially_shipped: { bg: '#F3E7CE', fg: '#7A5A17' },\n      shipped: { bg: '#DCEADD', fg: '#2E4A31' },\n      returned: { bg: '#E3E1F0', fg: '#413A6B' },\n    };\n    const pc = statusColors[o.paymentStatus] || statusColors.awaiting_payment;\n    const fc = statusColors[o.fulfillmentStatus] || statusColors.unfulfilled;\n\n    return {\n      isOrder: s.screen === 'order',\n      orderPaymentStatus: o.paymentStatus,\n      onOrderPaymentStatusChange: (e) => this.setState(st => ({ order: { ...st.order, paymentStatus: e.target.value } })),\n      paymentStatusOptions: ['awaiting_payment','paid','refunded','failed'],\n      orderFulfillmentStatus: o.fulfillmentStatus,\n      onOrderFulfillmentStatusChange: (e) => this.setState(st => ({ order: { ...st.order, fulfillmentStatus: e.target.value } })),\n      fulfillmentStatusOptions: ['unfulfilled','partially_shipped','shipped','returned'],\n      orderPaymentMode: o.paymentMode,\n      onOrderPaymentModeChange: (e) => this.setState(st => ({ order: { ...st.order, paymentMode: e.target.value } })),\n      orderIsQuote: o.quoteMode,\n      toggleOrderIsQuote: () => this.setState(st => ({ order: { ...st.order, quoteMode: !st.order.quoteMode } })),\n      orderReturnsEnabled: o.returnsEnabled,\n      toggleOrderReturnsEnabled: () => this.setState(st => ({ order: { ...st.order, returnsEnabled: !st.order.returnsEnabled } })),\n      orderTokenInvalid: o.tokenState === 'expired',\n      toggleOrderTokenInvalid: () => this.setState(st => ({ order: { ...st.order, tokenState: st.order.tokenState === 'expired' ? 'found' : 'expired' } })),\n\n      paymentBadgeLabel: o.paymentStatus.replace(/_/g,' '), paymentBadgeBg: pc.bg, paymentBadgeFg: pc.fg,\n      fulfillmentBadgeLabel: o.fulfillmentStatus.replace(/_/g,' '), fulfillmentBadgeBg: fc.bg, fulfillmentBadgeFg: fc.fg,\n\n      showPaymentCard: !o.quoteMode,\n      isPayNow: o.paymentMode === 'pay_now',\n      isBankTransfer: o.paymentMode === 'bank_transfer',\n      isCod: o.paymentMode === 'cod',\n      isAwaitingPayment: o.paymentStatus === 'awaiting_payment',\n      isNotAwaitingPayment: o.paymentStatus !== 'awaiting_payment',\n      showInvoiceDownload: o.paymentStatus === 'paid' || o.paymentStatus === 'refunded',\n      showProformaDownload: o.paymentMode === 'bank_transfer' && o.paymentStatus === 'awaiting_payment',\n\n      orderItems: [\n        { name: 'Field Oxford Shirt', variant: 'M / White', price: 128, shippedOf: o.fulfillmentStatus === 'shipped' ? '1 of 1' : (o.fulfillmentStatus === 'partially_shipped' ? '0 of 1' : '0 of 1') },\n        { name: 'Selvedge Denim Jacket', variant: 'L / Indigo', price: 245, shippedOf: o.fulfillmentStatus === 'shipped' ? '1 of 1' : '0 of 1' },\n      ],\n      hasDigitalDownloads: o.paymentStatus === 'paid',\n      canReturn: o.fulfillmentStatus === 'shipped',\n      ...this.accountVals(),\n    };\n  }\n\n  accountVals() {\n    const s = this.state;\n    const navigate = this.navigate;\n    const cs = s.customerState;\n    const tabDefs = [\n      { key: 'login', label: 'Sign in' },\n      { key: 'register-personal', label: 'Register' },\n      { key: 'register-business', label: 'Business' },\n    ];\n    const authTabs = tabDefs.map(t => ({\n      label: t.label,\n      onClick: () => this.setState({ accountTab: t.key }),\n      color: s.accountTab === t.key ? '#17140F' : '#8A8267',\n      border: s.accountTab === t.key ? '#17140F' : 'transparent',\n    }));\n\n    const namesByState = {\n      unverified: 'Marko Marić', verified: 'Marko Marić', 'business-pending': 'Ivana Design Studio d.o.o.', 'business-approved': 'Ivana Design Studio d.o.o.',\n    };\n\n    return {\n      isAccount: s.screen === 'account',\n      customerState: cs,\n      onCustomerStateSelect: (e) => this.setState({ customerState: e.target.value }),\n      isGuest: cs === 'guest',\n      authTabs,\n      isLoginTab: s.accountTab === 'login',\n      isRegisterPersonalTab: s.accountTab === 'register-personal',\n      isRegisterBusinessTab: s.accountTab === 'register-business',\n      goForgot: () => navigate('forgot'),\n      registerAsUnverified: () => this.setState({ customerState: 'unverified' }),\n      registerAsBusinessPending: () => this.setState({ customerState: 'business-pending' }),\n\n      isUnverified: cs === 'unverified',\n      isBusinessPending: cs === 'business-pending',\n      isBusinessApproved: cs === 'business-approved',\n      goVerify: () => navigate('verify'),\n      accountName: namesByState[cs] || 'Marko Marić',\n      accountEmail: cs.startsWith('business') ? 'ivana@studio.example' : 'marko.maric@email.example',\n      marketingStatus: 'Subscribed',\n      accountLinks: [\n        { label: 'Order history', onClick: () => navigate('orders') },\n        { label: 'Address book', onClick: () => navigate('addresses') },\n        { label: 'Wishlist', onClick: () => navigate('wishlist') },\n        { label: 'Wholesale price list', onClick: () => navigate('catalog') },\n      ],\n      logout: () => this.setState({ customerState: 'guest' }),\n      ...this.miscScreenVals(),\n    };\n  }\n\n  miscScreenVals() {\n    const s = this.state;\n    const navigate = this.navigate;\n    const statusColors = {\n      shipped: { bg: '#DCEADD', fg: '#2E4A31' },\n      unfulfilled: { bg: '#EFEAE1', fg: '#55503F' },\n      returned: { bg: '#E3E1F0', fg: '#413A6B' },\n    };\n    const orderHistory = [\n      { number: '#A-10482', date: 'Jul 2, 2026', itemCount: 2, status: 'shipped', total: 373, ...statusColors.shipped },\n      { number: '#A-10310', date: 'May 18, 2026', itemCount: 1, status: 'unfulfilled', total: 138, ...statusColors.unfulfilled },\n      { number: '#A-09982', date: 'Feb 4, 2026', itemCount: 1, status: 'returned', total: 58, ...statusColors.returned },\n    ].map(o => ({ ...o, onClick: () => navigate('order') }));\n\n    return {\n      isAddresses: s.screen === 'addresses',\n      addresses: [\n        { name: 'Marko Marić', line: 'Ilica 42, 10000 Zagreb, Croatia', isDefaultShip: true, isDefaultBill: true },\n        { name: 'Marko Marić — office', line: 'Vlaška 71, 10000 Zagreb, Croatia', isDefaultShip: false, isDefaultBill: false },\n      ],\n      isOrders: s.screen === 'orders',\n      ordersEmpty: false,\n      orderHistory,\n      goCatalog: () => navigate('catalog'),\n\n      isWishlist: s.screen === 'wishlist',\n      wishlistSyncNote: s.customerState === 'guest' || s.customerState === 'unverified' ? 'Saved on this device. Verify your account to sync across devices.' : 'Synced to your account.',\n      wishlistProducts: PRODUCTS.slice(2,5).map(p => ({ ...p, onOpen: () => { this.setState({ productView: p.id }); navigate('product'); } })),\n      ...this.staticScreenVals(),\n    };\n  }\n\n  staticScreenVals() {\n    const s = this.state;\n    const navigate = this.navigate;\n    return {\n      isForgot: s.screen === 'forgot',\n      isReset: s.screen === 'reset',\n      resetTokenValid: s.resetTokenValid !== false,\n      toggleResetTokenValid: () => this.setState(st => ({ resetTokenValid: st.resetTokenValid === false })),\n      goForgot: () => navigate('forgot'),\n      isVerify: s.screen === 'verify',\n      verifySucceeded: s.verifySucceeded !== false,\n      toggleVerifySucceeded: () => this.setState(st => ({ verifySucceeded: st.verifySucceeded === false })),\n      goAccountScreen: () => navigate('account'),\n      isCms: s.screen === 'cms',\n      isNotFound: s.screen === 'notfound',\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
