services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: project_webshop_template
      POSTGRES_USER: cms
      POSTGRES_PASSWORD: cms_local_password
      POSTGRES_HOST_AUTH_METHOD: md5
      POSTGRES_INITDB_ARGS: "--auth-host=md5"
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cms -d project_webshop_template"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Optional external search engine (core L9.7). The shop works without it (the
  # built-in Postgres search is the default + fallback); switch the engine in
  # admin → Commerce Settings → Search: provider "Meilisearch",
  # URL http://localhost:7700, API key dev_meili_master_key.
  meilisearch:
    image: getmeili/meilisearch:v1.15
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: dev_meili_master_key
      MEILI_ENV: development
      MEILI_NO_ANALYTICS: "true"
    ports:
      - "${MEILI_PORT:-7700}:7700"
    volumes:
      - meilidata:/meili_data

volumes:
  pgdata:
  meilidata:
